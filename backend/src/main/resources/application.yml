server:
  port: 8080

spring:
  application:
    name: devpulse-backend
  datasource:
    url: jdbc:h2:mem:devpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

devpulse:
  redis:
    channel: devpulse.events
  simulator:
    auto-start: true
    interval-ms: 4000

logging:
  level:
    com.devpulse: INFO
    org.springframework.web.socket: INFO
